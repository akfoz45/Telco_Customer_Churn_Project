<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Müşteri Kaybı (Churn) Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 2rem;
        }
        .customer-card {
            margin-bottom: 1rem;
        }
        .info-panel {
            border-right: 1px solid #eee;
        }
        .visual-panel {
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

    <div class="dashboard-container">
        <h2 class="mb-4">Müşteri Kaybı Analiz ve Geri Kazanım Paneli</h2>

        <div class="row">
            <div class="col-md-5 info-panel">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Müşteri Seçimi</h5>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="mb-3">
                                <label for="customerSelect" class="form-label">Analiz Edilecek Müşteriyi Seçin:</label>
                                <select class="form-select" id="customerSelect" required>
                                    <option value="" selected disabled>Müşteri seçiniz...</option>
                                    <option value="NEW">-- Yeni Test Müşterisi (Örnek Veri) --</option>
                                    {% for customer in customers %}
                                        <option value="{{ customer.id }}">{{ customer }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Risk Analizi Yap</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7 visual-panel">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center" id="resultPanel">
                        <h5 class="text-muted">Analiz sonucu burada görüntülenecek...</h5>
                        <div id="gaugeChartContainer" class="w-100 mt-3" style="height: 250px;"></div>
                        <h3 id="riskScore" class="mt-3"></h3>
                        <p id="actionMessage" class="lead"></p>
                        <div id="actionButtonContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        let riskChart = null;  

        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) return;

            const payload = {
                "id": customerId === "NEW" ? 9999 : parseInt(customerId),
                "gender": "Female",
                "SeniorCitizen": 0,
                "Partner": "Yes",
                "Dependents": "No",
                "tenure": 12,
                "PhoneService": "Yes",
                "MultipleLines": "No",
                "InternetService": "Fiber optic",
                "OnlineSecurity": "No",
                "OnlineBackup": "No",
                "DeviceProtection": "No",
                "TechSupport": "No",
                "StreamingTV": "Yes",
                "StreamingMovies": "Yes",
                "Contract": "Month-to-month",
                "PaperlessBilling": "Yes",
                "PaymentMethod": "Electronic check",
                "MonthlyCharges": 85.50,
                "TotalCharges": 1026.00
            };

            fetch('/api/predict/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    const riskScoreEl = document.getElementById('riskScore');
                    riskScoreEl.innerText = `Risk Oranı: %${data.churn_probability}`;
                    riskScoreEl.className = data.is_high_risk ? "mt-3 text-danger" : "mt-3 text-success";
                    
                    document.getElementById('actionMessage').innerText = data.message;

                    const btnContainer = document.getElementById('actionButtonContainer');
                    if(data.is_high_risk) {
                        btnContainer.innerHTML = `<button class="btn btn-danger btn-lg mt-2 w-100">SMS ile %15 Yenileme İndirimi Tanımla</button>`;
                    } else {
                        btnContainer.innerHTML = ''; 
                    }

                    drawGaugeChart(data.churn_probability);
                } else {
                    alert("Hata: " + data.error);
                }
            })
            .catch(error => {
                console.error('Hata:', error);
                alert("API ile iletişim kurulamadı.");
            });
        });

        function drawGaugeChart(probability) {
            const ctx = document.getElementById('gaugeChartContainer');
            
            if(riskChart !== null) {
                riskChart.destroy();
            }
            
            ctx.innerHTML = '<canvas id="riskCanvas"></canvas>';
            const canvas = document.getElementById('riskCanvas');

            const remainProb = 100 - probability;
            const color = probability >= 70 ? '#dc3545' : '#198754';

            riskChart = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: ['Risk', 'Güvende'],
                    datasets: [{
                        data: [probability, remainProb],
                        backgroundColor: [color, '#e9ecef'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    circumference: 180,
                    rotation: 270,      
                    cutout: '80%',      
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
