<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Customer Churn (Churn) Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1rem;
            width: 100%;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: transparent !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem !important;
            border-radius: 20px 20px 0 0 !important;
        }

        .text-muted {
            color: #94a3b8 !important;
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .form-select {
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23cbd5e1' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
        }

        .form-select:focus {
            background-color: rgba(15, 23, 42, 0.9);
            color: #fff;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .form-select option {
            background-color: #0f172a;
            color: #f8fafc;            
            padding: 12px;
        }

        .form-select option:disabled {
            color: #64748b;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
        }

        .page-title {
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .info-panel {
            border-right: none;
        }
        
        #waitingText {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .empty-icon {
            font-size: 3rem;
            color: #475569;
        }
        
        #riskScore {
            transition: color 0.3s ease;
        }

        .dropdown-item:hover, .dropdown-item:focus {
            background-color: rgba(139, 92, 246, 0.4) !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2 class="mb-5 text-center fw-bold page-title">
            <i class="bi bi-graph-up-arrow me-2"></i>Customer Churn Analysis and Recovery Panel
        </h2>

        <div class="row g-4 mt-2">
            <div class="col-md-5 info-panel">
                <div class="card h-100">
                    <div class="card-header d-flex align-items-center">
                        <div class="bg-primary bg-opacity-25 p-2 rounded-circle me-3">
                            <i class="bi bi-person-badge text-primary fs-5"></i>
                        </div>
                        <h5 class="mb-0 fw-semibold text-white">Customer Selection</h5>
                    </div>
                    <div class="card-body p-4 d-flex flex-column justify-content-center">
                        <form id="predictionForm">
                            <div class="mb-4 position-relative">
                                <label class="form-label">Select the customer to be analyzed.</label>
                                
                                <select id="customerSelect" required style="display:none;">
                                    <option value="" selected disabled></option>
                                    {% for customer in customers %}
                                        <option value="{{ customer.id }}">{{ customer }}</option>
                                    {% endfor %}
                                </select>

                                <button class="form-select text-start" type="button" id="customSelectBtn" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: rgba(15, 23, 42, 0.6); color: #f8fafc;">
                                    Please select a customer from the list...
                                </button>
                                
                                <ul class="dropdown-menu w-100" aria-labelledby="customSelectBtn" style="background-color: #0f172a; border: 1px solid rgba(255,255,255,0.1); max-height: 300px; overflow-y: auto;">
                                    {% for customer in customers %}
                                        <li><a class="dropdown-item text-white select-item" href="#" data-value="{{ customer.id }}">{{ customer }}</a></li>
                                    {% endfor %}
                                </ul>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2">
                                <i class="bi bi-cpu me-2"></i>Analyze with Artificial Intelligence
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7 visual-panel">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-5" id="resultPanel">
                        
                        <div id="waitingText" class="text-muted">
                            <i class="bi bi-pie-chart empty-icon"></i>
                            <h5 class="fw-light">The analysis results will be displayed here...</h5>
                            <p class="small text-secondary">Select a customer from the left side and start the analysis.</p>
                        </div>
                        
                        <div id="gaugeChartContainer" class="w-100" style="height: 280px; display: none;"></div>
                        
                        <h2 id="riskScore" class="mt-4 fw-bold"></h2>
                        <p id="actionMessage" class="lead mt-2 mb-4 text-center"></p>
                        <div id="actionButtonContainer" class="w-100 px-md-5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        let riskChart = null; 

        document.querySelectorAll('.select-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const selectedValue = this.getAttribute('data-value');
                const selectedText = this.innerText;
                
                document.getElementById('customerSelect').value = selectedValue;
                document.getElementById('customSelectBtn').innerText = selectedText;
            });
        });

        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) return;

            document.getElementById('waitingText').style.display = 'none';
            document.getElementById('gaugeChartContainer').style.display = 'block';

            const payload = {
                "id": parseInt(customerId)
            };

            fetch('/api/predict/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    const riskScoreEl = document.getElementById('riskScore');
                    riskScoreEl.innerText = `Risk Ratio: %${data.churn_probability}`;
                    
                    riskScoreEl.className = data.is_high_risk ? "mt-4 text-danger fw-bold" : "mt-4 text-success fw-bold";
                    
                    const msgEl = document.getElementById('actionMessage');
                    msgEl.innerText = data.message;
                    msgEl.style.color = "#cbd5e1"; 

                    const btnContainer = document.getElementById('actionButtonContainer');
                    if(data.is_high_risk) {
                        btnContainer.innerHTML = `<button id="smsButton" class="btn btn-danger btn-lg w-100 fw-bold shadow-lg" data-id="${data.customer_id}"><i class="bi bi-envelope-paper me-2"></i> SMS ile %15 Yenileme İndirimi Tanımla</button>`;
                    } else {
                        btnContainer.innerHTML = ''; 
                    }

                    drawGaugeChart(data.churn_probability);
                } else {
                    alert("Hata: " + data.error);
                }
            })
            .catch(error => console.error('Hata:', error));
        });

        document.getElementById('actionButtonContainer').addEventListener('click', function(e) {
            const btn = e.target.closest('#smsButton');
            if(btn) {
                const customerId = btn.getAttribute('data-id');
                
                const originalText = btn.innerHTML;
                btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...`;
                btn.disabled = true;

                fetch('/api/apply-campaign/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 'customer_id': customerId })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> The campaign was successfully implemented!';
                        btn.className = 'btn btn-success btn-lg w-100 fw-bold shadow-lg';
                    } else {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        alert("The operation failed.");
                    }
                })
                .catch(err => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    console.error('Hata:', err);
                });
            }
        });

        function drawGaugeChart(probability) {
            const ctx = document.getElementById('gaugeChartContainer');
            if(riskChart !== null) { riskChart.destroy(); }
            ctx.innerHTML = '<canvas id="riskCanvas"></canvas>';
            const canvas = document.getElementById('riskCanvas');

            const remainProb = 100 - probability;
            const color = probability >= 70 ? '#ef4444' : '#10b981'; 
            const bgColor = 'rgba(255, 255, 255, 0.05)'; 

            riskChart = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: ['Risk', 'Safe'],
                    datasets: [{
                        data: [probability, remainProb],
                        backgroundColor: [color, bgColor],
                        borderWidth: 0,
                        hoverOffset: 4,
                        borderRadius: 5 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    circumference: 180, 
                    rotation: 270,      
                    cutout: '80%', 
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { 
                            enabled: true,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: 'Inter' },
                            bodyFont: { family: 'Inter' },
                            padding: 10,
                            cornerRadius: 8
                        } 
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1500,
                        easing: 'easeInOutQuart'
                    }
                }
            });
        }
    </script>
</body>
</html>
